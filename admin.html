<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🙏 Admin - Intentions de prière</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            font-family: 'Inter', sans-serif;
            padding: 24px;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #2a2a3a;
            padding-bottom: 20px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f5d371;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i { font-size: 2rem; }
        .header .stats {
            background: #1a1a2e;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .header .stats span { color: #f5d371; font-weight: 700; }
        .btn-refresh {
            background: #2a2a3a;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn-refresh:hover { background: #3a3a4a; }
        .btn-refresh:active { transform: scale(0.97); }
        .table-wrapper {
            background: #1a1a2e;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #2a2a3a;
        }
        th {
            background: #12121f;
            color: #f5d371;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        td {
            vertical-align: top;
        }
        tr:hover { background: #22223a; }
        .intention-text {
            max-width: 300px;
            word-wrap: break-word;
            line-height: 1.5;
            color: #ccc;
        }
        .badge-priere {
            display: inline-block;
            background: rgba(245, 211, 113, 0.15);
            color: #f5d371;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty i {
            font-size: 3rem;
            color: #333;
            margin-bottom: 16px;
            display: block;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .loading i { color: #f5d371; }
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.7rem;
            color: #444;
        }
        @media (max-width: 700px) {
            th, td { padding: 10px 12px; font-size: 0.75rem; }
            .intention-text { max-width: 150px; }
            .header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-pray"></i> Intentions de prière</h1>
        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
            <div class="stats"><i class="fas fa-feather-alt"></i> <span id="countIntention">0</span> intentions reçues</div>
            <button class="btn-refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i> Synchroniser</button>
        </div>
    </div>

    <div class="table-wrapper">
        <div id="tableContainer">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>
        </div>
    </div>
    <div class="footer">🙏 Chaque prière est précieuse · Admin intentions de prière</div>
</div>

<script>
    // 🔴 REMPLACEZ PAR L'URL DE VOTRE SCRIPT APPS SCRIPT (doGet)
    const SHEET_DATA_URL = "https://script.google.com/macros/s/AKfycbzs8ylIZnAAlNSo6K8bn8USyFwuPjn8iBzrWD9VdggaO7hTtCsXNSNGD0b3wcut-skw/exec";

    let intentions = [];

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function chargerIntentions() {
        const container = document.getElementById('tableContainer');
        container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Synchronisation...</div>';
        
        try {
            const response = await fetch(SHEET_DATA_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            
            intentions = [];
            if (Array.isArray(data)) {
                for(let i = 0; i < data.length; i++) {
                    const ligne = data[i];
                    if (Array.isArray(ligne) && ligne.length >= 4) {
                        // Format: [Date, Nom, Email, Intention, Type, ...]
                        const date = ligne[0];
                        const nom = ligne[1];
                        const email = ligne[2];
                        const intention = ligne[3];
                        const type = ligne[4] || '';
                        if (nom && nom !== "" && nom !== "Nom" && nom !== "NOM") {
                            intentions.push({
                                date: date,
                                nom: nom,
                                email: email,
                                intention: intention,
                                type: type
                            });
                        }
                    }
                }
            }
            
            // Filtrer uniquement les intentions de prière (type "Prière" ou si type non défini mais contient une intention)
            const prieres = intentions.filter(i => i.type === 'Prière' || (i.intention && i.intention.trim() !== ''));
            
            afficherTableau(prieres);
            document.getElementById('countIntention').textContent = prieres.length;
            
        } catch(error) {
            console.error(error);
            container.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle"></i> Erreur de chargement.<br><span style="font-size:0.8rem;">Vérifiez l'URL du script Apps Script.</span></div>`;
        }
    }

    function afficherTableau(prieres) {
        const container = document.getElementById('tableContainer');
        if (prieres.length === 0) {
            container.innerHTML = `<div class="empty"><i class="fas fa-feather-alt"></i>Aucune intention de prière pour le moment.<br><span style="font-size:0.8rem;">Les intentions apparaîtront ici dès qu'elles seront déposées.</span></div>`;
            return;
        }
        
        let html = `<table><thead><tr>
            <th>Date</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Intention</th>
            <th>Type</th>
        </tr></thead><tbody>`;
        
        prieres.forEach(p => {
            const dateFormatee = p.date ? new Date(p.date).toLocaleString() : 'N/A';
            html += `<tr>
                <td style="font-size:0.7rem; color:#888;">${dateFormatee}</td>
                <td><strong>${escapeHtml(p.nom)}</strong></td>
                <td style="font-size:0.75rem; color:#aaa;">${escapeHtml(p.email) || '—'}</td>
                <td class="intention-text">${escapeHtml(p.intention)}</td>
                <td><span class="badge-priere"><i class="fas fa-pray"></i> Prière</span></td>
            </tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    document.getElementById('refreshBtn').addEventListener('click', chargerIntentions);
    chargerIntentions();
</script>
</body>
</html>

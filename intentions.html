<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🙏 Intentions de prière</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f97316 0%, #2e7d32 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 40px;
            padding: 32px 24px 40px;
            box-shadow: 0 40px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header .icon {
            font-size: 3.5rem;
            margin-bottom: 8px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #f97316;
            font-weight: 700;
        }
        .header p {
            color: #2e7d32;
            font-size: 0.9rem;
            margin-top: 4px;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group label i {
            color: #f97316;
            margin-right: 6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e0d8;
            border-radius: 24px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: 0.2s;
            background: #fcf9f5;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f97316;
            background: white;
            box-shadow: 0 0 0 4px rgba(249,115,22,0.15);
        }
        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }
        .form-group .hint {
            font-size: 0.7rem;
            color: #999;
            margin-top: 4px;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(95deg, #f97316, #2e7d32);
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .btn-submit i {
            font-size: 1.2rem;
        }
        .message-box {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 24px;
            display: none;
            font-weight: 500;
        }
        .message-box.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message-box.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.7rem;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .footer a {
            color: #f97316;
            text-decoration: none;
            font-weight: 600;
        }
        .intention-example {
            background: #f1f8e9;
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #2e7d32;
            border-left: 4px solid #f97316;
        }
        .intention-example i {
            color: #f97316;
            margin-right: 6px;
        }
        .badge {
            display: inline-block;
            background: #ffedd5;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            color: #f97316;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🙏</div>
            <h1>Intentions de prière</h1>
            <p>✧ Joël & Nadège ✧</p>
            <div style="margin-top: 6px;"><span class="badge"><i class="fas fa-heart" style="color:#f97316;"></i> 6 juin 2026</span></div>
        </div>

        <div class="intention-example">
            <i class="fas fa-lightbulb"></i> Exemple : <em>"Je prie pour la bénédiction du Seigneur sur ce couple, pour qu'ils grandissent dans l'amour et la foi."</em>
        </div>

        <form id="priereForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Votre prénom & nom</label>
                <input type="text" id="nom" placeholder="Ex: Marie Zongo" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Votre email (optionnel)</label>
                <input type="email" id="email" placeholder="Ex: marie@email.com">
                <div class="hint">Pour que les mariés puissent vous remercier</div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-pray"></i> Votre intention de prière</label>
                <textarea id="intention" placeholder="Écrivez ici votre prière pour Joël & Nadège..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Envoyer ma prière
            </button>
        </form>

        <div id="messageBox" class="message-box"></div>

        <div class="footer">
            <i class="fas fa-arrow-left"></i> <a href="https://dom021293-pixel.github.io/invitation-joel-ingrid/">Retour à la carte d'invitation</a>
        </div>
    </div>

    <script>
        // 🔴 REMPLACEZ CETTE URL PAR LA VÔTRE (script Google Apps Script pour les intentions)
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbywx7T5nWQ8nepqGPcDF8cekWwh1e9zb0QDXjQgRHV4gU4CTQIe88bMTWqV_pvR3oJS/exec";

        const form = document.getElementById('priereForm');
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        // Gestion du formulaire
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const intention = document.getElementById('intention').value.trim();

            if (!nom || !intention) {
                showMessage("Veuillez remplir votre nom et votre intention de prière.", "error");
                return;
            }

            // Désactiver le bouton pour éviter les doubles envois
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi en cours...';

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'priere',
                        nom: nom,
                        email: email || "Non renseigné",
                        intention: intention,
                        date: new Date().toISOString()
                    })
                });

                // En mode no-cors, on ne peut pas lire la réponse, mais on considère que c'est ok
                showMessage("🙏 Merci pour votre intention de prière ! Joël & Nadège seront touchés par votre geste.", "success");
                form.reset();
                
            } catch(error) {
                console.error("Erreur:", error);
                showMessage("❌ Une erreur s'est produite. Veuillez réessayer ou contacter les mariés directement.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Envoyer ma prière';
            }
        });

        function showMessage(msg, type) {
            messageBox.textContent = msg;
            messageBox.className = 'message-box ' + type;
            messageBox.style.display = 'block';
            // Auto-masquer après 8 secondes
            clearTimeout(window.messageTimeout);
            window.messageTimeout = setTimeout(() => {
                messageBox.style.display = 'none';
            }, 8000);
        }
    </script>
</body>
</html>
